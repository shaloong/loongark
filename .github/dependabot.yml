version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # 暂停常规版本升级 PR；保留依赖告警与手动升级验证。
    open-pull-requests-limit: 0
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*"]
      react-runtime:
        patterns: ["react", "react-dom"]
      ark-zag:
        patterns: ["@ark-ui/*", "@zag-js/*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
