name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: '已验收且已创建标签的正式版本，如 0.1.0'
        required: true
        type: string
      readiness_run:
        description: '同一标签提交在 main 上完整通过的 Release readiness run ID'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm-publish
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Require verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          READINESS_RUN: ${{ inputs.readiness_run }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          const {RELEASE_VERSION:version,READINESS_RUN:run,REPOSITORY:repo}=process.env;
          assert.match(version,/^\d+\.\d+\.\d+$/);
          assert.match(run,/^\d+$/);
          const api=path=>JSON.parse(execFileSync('gh',['api',`repos/${repo}/${path}`],{encoding:'utf8'}));
          const sha=execFileSync('git',['rev-parse',`refs/tags/v${version}^{commit}`],{encoding:'utf8'}).trim();
          execFileSync('git',['merge-base','--is-ancestor',sha,'origin/main']);
          const release=JSON.parse(execFileSync('gh',['release','view',`v${version}`,'--repo',repo,'--json','tagName,isDraft'],{encoding:'utf8'}));
          assert.equal(release.tagName,`v${version}`);
          assert.equal(release.isDraft,true,'正式公开前必须保留Release草稿');
          const verified=api(`actions/runs/${run}`);
          assert.equal(verified.path,'.github/workflows/release-readiness.yml');
          assert.equal(verified.head_branch,'main');
          assert.equal(verified.head_sha,sha);
          assert.equal(verified.event,'workflow_dispatch');
          assert.equal(verified.conclusion,'success');
          const jobs=api(`actions/runs/${run}/jobs?per_page=100`).jobs;
          const steps=jobs.flatMap(job=>job.steps);
          for(const name of ['Check requested version','Run pnpm check:versions','Run pnpm check:rsc','Complete reference examples'])
            assert.ok(steps.some(step=>step.name===name && step.conclusion==='success'),`缺少完整验收：${name}`);
          execFileSync('git',['checkout','--detach',sha]);
          appendFileSync(process.env.GITHUB_ENV,`RELEASE_VERSION=${version}\n`);
          NODE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-readiness-evidence
          run-id: ${{ inputs.readiness_run }}
          github-token: ${{ github.token }}
          path: .artifacts/verified-release
      - name: Publish verified tarballs in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-release.mjs
      - name: Verify registry propagation and original tarballs
        run: node scripts/check-registry.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Consume published versions
        env:
          RELEASE_SOURCE: registry
        run: |
          export RELEASE_PACK_REPORT="$(find .artifacts/verified-release -path '*/packages/report.json' -type f)"
          node scripts/check-versions.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: published-package-evidence
          path: .artifacts/releases/published/
          retention-days: 14
          if-no-files-found: ignore
      - name: Attach original tarballs to release draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/attach-release-assets.mjs
