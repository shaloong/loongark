name: Node compatibility

on:
  push:
    branches: [develop]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'tests/consumers/**'
      - '*tsconfig*.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/node-compatibility.yml'
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-compatibility-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Node ${{ matrix.node }} / build and SSR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 日常完整验收使用 .nvmrc 的24；这里补充声明下限与当前26。
        node: ['22.12.0', '26.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm check:playwright
      - run: pnpm check:contracts
      - run: pnpm check:publication
