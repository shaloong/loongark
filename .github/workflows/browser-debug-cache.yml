name: Browser debug cache
on:
  push:
    branches: [develop]
    paths: [.github/workflows/browser-debug-cache.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install ${{ matrix.browser }}
      - name: 打包同版本浏览器用于本地重现
        run: |
          mkdir -p .artifacts/browser-debug
          tar -C "$HOME/.cache/ms-playwright" -czf .artifacts/browser-debug/${{ matrix.browser }}.tar.gz  .
          split -b 16M -d .artifacts/browser-debug/${{ matrix.browser }}.tar.gz .artifacts/browser-debug/${{ matrix.browser }}-part-
          rm .artifacts/browser-debug/${{ matrix.browser }}.tar.gz
          test "$(ls .artifacts/browser-debug/${{ matrix.browser }}-part-* | wc -l)" -le 8
          cd .artifacts/browser-debug
          sha256sum ${{ matrix.browser }}-part-* > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-part-0
          path: .artifacts/browser-debug/${{ matrix.browser }}-part-00
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-part-1
          path: .artifacts/browser-debug/${{ matrix.browser }}-part-01
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-part-2
          path: .artifacts/browser-debug/${{ matrix.browser }}-part-02
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-part-3
          path: .artifacts/browser-debug/${{ matrix.browser }}-part-03
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-part-4
          path: .artifacts/browser-debug/${{ matrix.browser }}-part-04
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-part-5
          path: .artifacts/browser-debug/${{ matrix.browser }}-part-05
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-part-6
          path: .artifacts/browser-debug/${{ matrix.browser }}-part-06
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-part-7
          path: .artifacts/browser-debug/${{ matrix.browser }}-part-07
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-debug-checksums
          path: .artifacts/browser-debug/checksums.txt
          retention-days: 14
