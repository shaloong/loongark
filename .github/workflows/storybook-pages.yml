name: Storybook Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm check:contracts
      - run: pnpm storybook:build
      - run: pnpm check:coverage
      - run: pnpm check:publication
      - run: pnpm check:svelte
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook-static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-pages-smoke
          path: .artifacts/pages-smoke/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/develop'
        with:
          name: storybook-development-preview
          path: storybook-static/
          retention-days: 14
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: storybook-static

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Storybook
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from urllib.parse import urljoin
          base = os.environ['PAGES_URL'].rstrip('/') + '/'
          for attempt in range(12):
              try:
                  for path in ['', 'iframe.html', 'index.json']:
                      with urllib.request.urlopen(urljoin(base, path), timeout=15) as response:
                          assert response.status == 200
                          content = response.read()
                      if path == 'index.json':
                          entries = json.loads(content)['entries']
                          assert all(story in entries for story in ['components-datatable--frozen', 'components-icon--basic', 'components-questionnaire--async-validation', 'components-datatable--editing', 'components-datatable--complex-editors', 'components-datatable--batch-editing', 'components-datatable--virtualized', 'components-messagescroller--virtualized', 'components-chart--zoom-and-brush', 'components-questionnaire--structured-types', 'compositions-ark-utilities--async-collection'])
                  print('Published Storybook homepage, iframe and Story index verified:', base)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          PY
